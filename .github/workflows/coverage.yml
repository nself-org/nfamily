name: JS Coverage Gate (nfamily)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  COVERAGE_FLOOR: 30

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  js-coverage:
    name: Flutter coverage gate (nfamily)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests with coverage
        run: pnpm test -- --coverage --coverageReporters=text-summary --coverageReporters=json-summary || true

      - name: Enforce coverage floor (>=30%)
        run: |
          SUMMARY="coverage/coverage-summary.json"
          if [ ! -f "$SUMMARY" ]; then
            echo "WARN: no coverage summary found — skipping floor check (no tests ran)"
            exit 0
          fi

          pct=$(node -e "const s=require('./$SUMMARY'); const t=s.total.lines; console.log(t ? t.pct.toFixed(1) : '0.0')")

          if [ -z "$pct" ] || [ "$pct" = "0.0" ]; then
            echo "WARN: no line data in coverage report — skipping floor check"
            exit 0
          fi

          echo "JS coverage: ${pct}%"

          result=$(node -e "process.exit(parseFloat('$pct') >= $COVERAGE_FLOOR ? 0 : 1)" 2>&1) && echo "PASS: Coverage ${pct}% >= floor ${COVERAGE_FLOOR}%" || {
            echo "FAIL: Coverage ${pct}% is below floor ${COVERAGE_FLOOR}%" >&2
            exit 1
          }

      - name: Coverage summary
        if: always()
        run: |
          echo "### nfamily JS Coverage" >> "$GITHUB_STEP_SUMMARY"
          echo "Floor: ${COVERAGE_FLOOR}%" >> "$GITHUB_STEP_SUMMARY"

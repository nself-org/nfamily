name: JS Coverage Gate (nfamily)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  COVERAGE_FLOOR: 30

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  js-coverage:
    name: RN/Expo coverage gate (nfamily)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests with coverage
        run: pnpm test --coverage || true

      - name: Enforce coverage floor (>=30%)
        run: |
          if [ ! -f coverage/lcov.info ]; then
            echo "WARN: no coverage data — skipping floor check (no tests ran)"
            exit 0
          fi
          total=$(grep '^LF:' coverage/lcov.info | awk -F: '{sum += $2} END {print sum}')
          covered=$(grep '^LH:' coverage/lcov.info | awk -F: '{sum += $2} END {print sum}')

          if [ -z "$total" ] || [ "$total" -eq 0 ]; then
            echo "WARN: no line data in coverage report — skipping floor check"
            exit 0
          fi

          pct=$(awk -v c="$covered" -v t="$total" 'BEGIN { printf "%.1f", (c/t)*100 }')
          echo "RN/Expo coverage: ${pct}% (${covered}/${total} lines)"

          result=$(awk -v pct="$pct" -v floor="$COVERAGE_FLOOR" 'BEGIN { print (pct+0 >= floor+0) ? "pass" : "fail" }')
          if [ "$result" = "fail" ]; then
            echo "FAIL: Coverage ${pct}% is below floor ${COVERAGE_FLOOR}%" >&2
            exit 1
          fi
          echo "PASS: Coverage ${pct}% >= floor ${COVERAGE_FLOOR}%"

      - name: Coverage summary
        if: always()
        run: |
          echo "### nfamily RN/Expo Coverage" >> "$GITHUB_STEP_SUMMARY"
          echo "Floor: ${COVERAGE_FLOOR}%" >> "$GITHUB_STEP_SUMMARY"

name: Hygiene

# Consolidates the trivial, no-toolchain repo gates into one workflow with a
# single checkout, so a push doesn't queue four separate near-instant jobs
# for four separate runners. None of these are required branch-protection
# checks for nfamily (only "Lint and test (RN/Expo)" and "gitleaks" are).
#
# Trigger scope is the union of the four originals — clean-root and doc-sync
# ran on push[main] + pull_request (any branch); generated-file-gate and
# multi-arch-check ran on push/pull_request[main] only, and multi-arch-check
# also allowed workflow_dispatch. Union is broader, never narrower, so
# nothing that used to run stops running.
#
# nself-first-check.yml is deliberately NOT folded in here — it's already
# scoped to `paths: ['**/docker-compose*.yml', ...]` and fires on almost no
# pushes. Merging it into a workflow that must run on every push would make
# it run far more often, which is the opposite of the goal.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: hygiene-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hygiene:
    name: hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # ── from clean-root.yml ──────────────────────────────────────
      - name: Forbid markdown at repo root other than README.md
        run: |
          OFFENDERS=$(find . -maxdepth 1 -name '*.md' ! -name 'README.md' -type f | sort)
          if [ -n "$OFFENDERS" ]; then
            echo "::error::Disallowed markdown files at repo root:"
            echo "$OFFENDERS"
            exit 1
          fi

      - name: Forbid tracked .DS_Store
        run: |
          if git ls-files | grep -q '\.DS_Store'; then
            echo "::error::.DS_Store tracked in git. Run: git rm --cached .DS_Store"
            exit 1
          fi

      - name: Forbid tracked secrets
        run: |
          OFFENDERS=$(git ls-files | grep -E '^\.env$|^\.env\.local$|^\.env\.secrets$|\.pem$|\.key$' || true)
          if [ -n "$OFFENDERS" ]; then
            echo "::error::Secret files tracked in git:"
            echo "$OFFENDERS"
            exit 1
          fi

      # ── from doc-sync.yml ────────────────────────────────────────
      - name: Verify doc sync (placeholder — no user-visible surface yet)
        run: test -f README.md

      # ── from generated-file-gate.yml ─────────────────────────────
      - name: Scan diff for GENERATED BY markers
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch origin main --depth=1
            BASE="origin/main"
          else
            BASE="${{ github.event.before }}"
            if [ -z "$BASE" ] || ! git cat-file -e "$BASE" 2>/dev/null; then
              BASE="HEAD~1"
            fi
          fi

          CHANGED=$(git diff --name-only "$BASE"...HEAD || true)
          if [ -z "$CHANGED" ]; then
            echo "No changed files to scan."
            exit 0
          fi

          FAIL=0
          while IFS= read -r f; do
            [ -f "$f" ] || continue
            if head -n 5 "$f" | grep -q "# GENERATED BY"; then
              if git check-ignore -q "$f"; then
                echo "OK: $f is generated but gitignored."
              else
                echo "ERROR: Refusing to commit generated file. Add to .gitignore first."
                echo "  -> $f"
                FAIL=1
              fi
            fi
          done <<< "$CHANGED"

          if [ "$FAIL" -eq 1 ]; then
            echo "ERROR: Refusing to commit generated file. Add to .gitignore first."
            exit 1
          fi

          echo "Generated File Gate: clean."

      # ── from multi-arch-check.yml ────────────────────────────────
      # Repo type: Flutter/RN family app (nself-org/nfamily). Authority:
      # S30-T05, STORM-CROSS-PLATFORM. No Go binaries or Docker images
      # produced, so multi-arch is N/A — this step is a documented pass.
      - name: Multi-arch check (N/A)
        run: |
          echo "Repo type: Flutter family app (nself-org/nfamily)"
          echo "No Go binaries or Docker images produced. Multi-arch check N/A. PASS."

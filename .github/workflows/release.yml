name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  # ── GitHub Release ──────────────────────────────────────────────────────────
  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true

  # ── Android (EAS) ──────────────────────────────────────────────────────────
  # Requires secret: EXPO_TOKEN (from expo.dev account settings)
  # Until EXPO_TOKEN is set, this job fails at the EAS build step.
  # Set via: gh secret set EXPO_TOKEN --repo nself-org/nfamily
  release-android:
    name: Release Android (EAS)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install EAS CLI
        run: pnpm add -g eas-cli
      - name: Build Android (EAS)
        run: eas build --platform android --profile production --non-interactive --no-wait
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

  # ── iOS (EAS) ──────────────────────────────────────────────────────────────
  # Requires secret: EXPO_TOKEN
  # Apple signing credentials are managed in EAS (not GitHub secrets).
  # Set via: gh secret set EXPO_TOKEN --repo nself-org/nfamily
  release-ios:
    name: Release iOS (EAS)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install EAS CLI
        run: pnpm add -g eas-cli
      - name: Build iOS (EAS)
        run: eas build --platform ios --profile production --non-interactive --no-wait
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

name: CI
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lint-and-test:
    name: Lint and test (RN/Expo)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 20
      - uses: pnpm/action-setup@v6
        with:
          version: 9
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Dependency audit
        # P4-E5-W3-S05-T17: fail on HIGH/CRITICAL advisories.
        run: pnpm audit --audit-level=high
      - name: Lint
        run: pnpm lint
      - name: Test
        run: pnpm test

  # ─── Android debug build (Expo managed) ─────────────────────────
  # Expo managed workflow — no native android/ directory; export validates
  # the JS bundle can be built for Android without signing secrets.
  # Release builds (EAS / Play Store) are handled by release.yml.
  android-build:
    name: Android · export bundle (Expo)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 9

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Export Android bundle (debug)
        run: npx expo export --platform android
